[package]
name = "maml"
version = "0.1.0"
edition = "2024"
description = "A parser and serializer for MAML (Minimal Abstract Markup Language)"
repository = "https://github.com/maml-dev/maml-rs"
homepage = "https://maml.dev"
documentation = "https://docs.rs/maml"
license = "MIT"
readme = "README.md"
keywords = ["maml", "parser", "serializer", "config", "markup"]
categories = ["config", "encoding", "parser-implementations"]

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[test]]
name = "serde_tests"
required-features = ["serde"]
